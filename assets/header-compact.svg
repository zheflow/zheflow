<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">zheflow — Ideas into systems.</title>
  <desc id="desc">A compact personal lab header with mint orbital lines. AI systems, creative tools, and robotics.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="720" y2="420" gradientUnits="userSpaceOnUse"><stop stop-color="#101B2D"/><stop offset="1" stop-color="#0A1720"/></linearGradient>
    <linearGradient id="accent" x1="510" y1="104" x2="634" y2="240" gradientUnits="userSpaceOnUse"><stop stop-color="#93F3D9"/><stop offset="1" stop-color="#6C9FFF"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#39BFA9" stop-opacity=".16"/><stop offset="1" stop-color="#39BFA9" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" stroke="#9DBAD3" stroke-opacity=".045"/></pattern>
    <clipPath id="clip"><rect x="1" y="1" width="718" height="418" rx="20"/></clipPath>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
      .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace}
      .orbit{transform-origin:576px 172px;animation:orbit 36s linear infinite}
      @keyframes orbit{to{transform:rotate(360deg)}}
      @media(prefers-reduced-motion:reduce){.orbit{animation:none}}
    </style>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="720" height="420" fill="url(#bg)"/><rect width="720" height="420" fill="url(#grid)"/>
    <circle cx="576" cy="172" r="210" fill="url(#halo)"/>
    <path d="M0 57H720" stroke="#304258" stroke-opacity=".6"/>
    <circle cx="34" cy="29" r="4" fill="#52DEC5"/>
    <text class="mono" x="50" y="35" fill="#A7BDC8" font-size="16" letter-spacing="1.2">zheflow / personal lab</text>
    <g stroke="#537885" stroke-opacity=".5">
      <circle cx="576" cy="172" r="91" stroke-dasharray="2 8"/>
      <ellipse cx="576" cy="172" rx="106" ry="44" transform="rotate(-31 576 172)" stroke="#6AE5CC"/>
      <ellipse cx="576" cy="172" rx="106" ry="44" transform="rotate(42 576 172)" stroke="#7FAAFF"/>
    </g>
    <g class="orbit"><circle cx="576" cy="172" r="91" stroke="#74E9D0" stroke-opacity=".7" stroke-dasharray="35 537" stroke-linecap="round"/><circle cx="667" cy="172" r="3" fill="#93F4D9"/></g>
    <path d="M544 143H615L604 157H571L551 177H588L573 191H536L525 204H596L625 175L615 164L589 190H558L605 143" fill="url(#accent)" fill-opacity=".12" stroke="url(#accent)" stroke-width="1.7" stroke-linejoin="round"/>
    <g class="sans">
      <text x="34" y="174" fill="#F0F6FC" font-size="94" font-weight="750" letter-spacing="-5">zheflow<tspan fill="#63E2C6">.</tspan></text>
      <text x="38" y="232" fill="#D9E6ED" font-size="33" font-weight="500" letter-spacing="-.7">Ideas into systems.</text>
      <text x="39" y="268" fill="#91A6B9" font-size="22">Code. Create. Make things move.</text>
    </g>
    <g class="mono" font-size="15" letter-spacing=".6">
      <rect x="38" y="307" width="128" height="36" rx="5" fill="#122B2B" stroke="#285147"/><text x="53" y="331" fill="#87E2CB">AI SYSTEMS</text>
      <rect x="178" y="307" width="167" height="36" rx="5" fill="#152437" stroke="#2D405C"/><text x="193" y="331" fill="#A6C4EE">CREATIVE TOOLS</text>
      <rect x="357" y="307" width="115" height="36" rx="5" fill="#202138" stroke="#3A3C59"/><text x="372" y="331" fill="#C5BCEB">ROBOTICS</text>
    </g>
    <path d="M32 374H688" stroke="#263B4A"/>
    <text class="mono" x="39" y="400" fill="#829AAF" font-size="14" letter-spacing="1.2">ENDLESS CURIOSITY / STILL BUILDING</text>
  </g>
  <rect x=".5" y=".5" width="719" height="419" rx="20" stroke="#355266"/>
</svg>
